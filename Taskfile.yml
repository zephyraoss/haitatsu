version: '3'

vars:
  BIN: haitatsu
  LINUX_BIN: haitatsu-linux-amd64
  IMAGE: haitatsu:local
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -X github.com/zephyraoss/haitatsu/internal/version.Version={{.VERSION}}
  COMPOSE: docker compose -f compose.yaml

tasks:
  build:
    desc: Build local executable
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/haitatsu

  test:
    desc: Run unit and integration tests
    cmds:
      - go test -race ./...

  generate:
    desc: Regenerate ent code from schema
    dir: internal/database/ent
    cmds:
      - go generate ./...

  build:linux:
    desc: Build Linux amd64 executable
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.LINUX_BIN}} ./cmd/haitatsu

  docker:build:
    desc: Build Docker container image (local platform)
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t {{.IMAGE}} .

  compose:up:
    desc: Run test email server stack
    deps:
      - docker:build
    cmds:
      - '{{.COMPOSE}} up -d'

  compose:down:
    desc: Stop test email server stack
    cmds:
      - '{{.COMPOSE}} down'

  db:wipe:
    desc: Wipe Postgres data in the compose stack
    cmds:
      - '{{.COMPOSE}} stop haitatsu'
      - '{{.COMPOSE}} exec -T postgres psql -U haitatsu -d haitatsu -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"'
      - '{{.COMPOSE}} start haitatsu'

  compose:reset:
    desc: Remove all compose containers and volumes
    cmds:
      - '{{.COMPOSE}} down -v --remove-orphans'
