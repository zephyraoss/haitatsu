version: '3'

vars:
  BIN: haitatsu
  LINUX_BIN: haitatsu-linux-amd64
  IMAGE: haitatsu:local
  ACR_NAME:
    sh: echo "${ACR_NAME:-haitatsuacr}"
  IMAGE_TAG:
    sh: echo "${IMAGE_TAG:-v1}"
  ACR_IMAGE: '{{.ACR_NAME}}.azurecr.io/haitatsu:{{.IMAGE_TAG}}'
  DOCKER_PLATFORM: linux/amd64
  COMPOSE: docker compose -f compose.yaml

tasks:
  build:
    desc: Build local executable
    cmds:
      - go build -o {{.BIN}} ./cmd/haitatsu

  build:linux:
    desc: Build Linux amd64 executable
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - go build -o {{.LINUX_BIN}} ./cmd/haitatsu

  docker:build:
    desc: Build Docker container image (local platform)
    cmds:
      - docker build -t {{.IMAGE}} .

  docker:build:linux:
    desc: Build Docker image for linux/amd64 (Azure VMSS)
    cmds:
      - docker build --platform {{.DOCKER_PLATFORM}} -t {{.ACR_IMAGE}} .

  docker:login:acr:
    desc: Log in to Azure Container Registry (admin user; set ACR_PASSWORD)
    cmds:
      - test -n "$ACR_PASSWORD" || (echo "set ACR_PASSWORD to the registry admin password" >&2 && exit 1)
      - echo "$ACR_PASSWORD" | docker login {{.ACR_NAME}}.azurecr.io -u {{.ACR_NAME}} --password-stdin

  docker:push:acr:
    desc: Push linux/amd64 image to ACR (run docker:build:linux first, or use docker:publish)
    cmds:
      - docker push {{.ACR_IMAGE}}

  docker:publish:
    desc: Build linux/amd64 and push to ACR (one step; requires docker login)
    cmds:
      - docker buildx build --platform {{.DOCKER_PLATFORM}} -t {{.ACR_IMAGE}} --push .

  compose:up:
    desc: Run test email server stack
    deps:
      - docker:build
    cmds:
      - '{{.COMPOSE}} up -d'

  compose:down:
    desc: Stop test email server stack
    cmds:
      - '{{.COMPOSE}} down'

  db:wipe:
    desc: Wipe Postgres data in the compose stack
    cmds:
      - '{{.COMPOSE}} stop haitatsu'
      - '{{.COMPOSE}} exec -T postgres psql -U haitatsu -d haitatsu -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"'
      - '{{.COMPOSE}} start haitatsu'

  compose:reset:
    desc: Remove all compose containers and volumes
    cmds:
      - '{{.COMPOSE}} down -v --remove-orphans'
